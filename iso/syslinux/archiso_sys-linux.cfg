LABEL arch
TEXT HELP
Boot the Lumen live system on BIOS.
It allows you to install Lumen or perform system maintenance.
ENDTEXT
MENU LABEL Lumen live system (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash

# For NVIDIA graphics cards that show a black or frozen screen: leaves the NVIDIA card without a driver
LABEL archsafe
TEXT HELP
Boot the Lumen live system without the open-source NVIDIA driver (nouveau).
Use this if the screen stays black or freezes on a computer with NVIDIA graphics.
ENDTEXT
MENU LABEL Lumen live system (%ARCH%, BIOS, safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nouveau.modeset=0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Lumen live system on BIOS with speakup screen reader.
It allows you to install Lumen or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Lumen live system (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
