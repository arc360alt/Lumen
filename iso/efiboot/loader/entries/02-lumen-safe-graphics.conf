title    Lumen live system (%ARCH%, UEFI, safe graphics: for NVIDIA cards that show a black screen)
sort-key 01s
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nouveau.modeset=0 lumen.safegfx=1
