# Lumen: before the login screen / auto-login starts
#  - the graphics driver is up and hardware vs software rendering is decided (lumen-graphics.service): NVIDIA's
#    driver loads after the start-up image, and X started before it fails (no auto-login, login screen instead)
#  - the boot screen (Plymouth) has handed over the display, otherwise cage / X can't take the screen
[Unit]
Wants=lumen-graphics.service plymouth-quit.service
After=lumen-graphics.service plymouth-quit.service plymouth-quit-wait.service
