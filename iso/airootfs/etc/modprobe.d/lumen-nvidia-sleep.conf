# Lumen: let NVIDIA graphics survive sleep (closing the lid).
#
# Most current laptops (Intel 12th gen+, recent AMD) only have "s2idle" sleep (Modern Standby), not the old S3
# sleep - check with: cat /sys/power/mem_sleep. NVIDIA's driver only powers the card down properly in s2idle when
# S0ix power management is on; without it the card stays half awake while the laptop sleeps and often doesn't come
# back: a black screen with the fans at full speed after opening the lid.
#
# PreserveVideoMemoryAllocations keeps the contents of the card's memory (the desktop's windows) over sleep; the
# 595+ driver does the saving itself through kernel suspend notifiers (no nvidia-suspend/resume services needed),
# into NVreg_TemporaryFilePath (/var/tmp, set by nvidia-utils).
#
# Both are ignored on computers without the NVIDIA driver, and EnableS0ixPowerManagement only matters in s2idle.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_EnableS0ixPowerManagement=1
